<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文化祭 入場受付スキャナー</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; text-align: center; background-color: #f0f2f5; margin: 0; padding: 15px; }
    h2 { color: #333; margin-top: 5px; }
    
    /* カメラエリア */
    #video-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 10px auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    
    video { width: 100%; height: auto; display: block; }
    
    /* QRコード読み取り枠（ビデオの一番上に重ねる） */
    .scan-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      border: 4px solid #007aff;
      border-radius: 16px;
      box-sizing: border-box;
      z-index: 10;
      pointer-events: none;
    }

    #result { max-width: 400px; margin: 15px auto; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 10px; white-space: pre-wrap; line-height: 1.5; }
    .ok { background-color: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
    .error { background-color: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
    .loading { background-color: #fff3cd; color: #856404; border: 2px solid #ffeeba; }
    .start-btn { background-color: #007aff; color: white; border: none; padding: 16px 32px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

  <h2>文化祭 入場受付スキャナー</h2>
  
  <button id="start-btn" class="start-btn" onclick="startScanner()">📷 カメラを起動する</button>
  
  <div id="video-container" style="display:none;">
    <video id="video" autoplay playsinline muted></video>
    <!-- ガイド枠 -->
    <div class="scan-guide"></div>
  </div>
  <canvas id="canvas" style="display:none;"></canvas>
  
  <div id="result" class="loading" style="display:none;"></div>

  <script>
    // ★ご自身のGASデプロイURLを貼り付けます
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbw7vZEnHH3DFY14ykVXS9Vo3717a4eWACnrHwRKT23jnwDh_5tyP5M2KDY68kZ9gBLpYw/exec";

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const canvasContext = canvas.getContext('2d');
    const resultDiv = document.getElementById('result');
    let isProcessing = false;
    let isScanning = false;

    async function startScanner() {
      document.getElementById('start-btn').style.display = 'none';
      document.getElementById('video-container').style.display = 'block';
      resultDiv.style.display = 'block';
      resultDiv.className = 'loading';
      resultDiv.innerText = "カメラを起動中...";

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } }
        });
        video.srcObject = stream;
        video.setAttribute("playsinline", true);
        await video.play();

        resultDiv.innerText = "枠内にQRコードをかざしてください";
        isScanning = true;
        requestAnimationFrame(tick);
      } catch (err) {
        resultDiv.className = 'error';
        resultDiv.innerText = "【カメラ起動エラー】\nカメラのアクセスを許可してください";
        document.getElementById('start-btn').style.display = 'inline-block';
      }
    }

    function tick() {
      if (!isScanning) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        canvasContext.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const imageData = canvasContext.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "dontInvert",
        });

        if (code && code.data && !isProcessing) {
          onScanSuccess(code.data);
        }
      }
      
      requestAnimationFrame(tick);
    }

    function onScanSuccess(decodedText) {
      isProcessing = true;

      resultDiv.className = 'loading';
      resultDiv.innerText = "照合中...";

      const requestUrl = `${GAS_API_URL}?ticketId=${encodeURIComponent(decodedText)}`;

      fetch(requestUrl, { method: "GET", redirect: "follow" })
        .then(response => {
          if (!response.ok) throw new Error("ネットワーク応答エラー");
          return response.json();
        })
        .then(res => {
          resultDiv.className = res.success ? 'ok' : 'error';
          resultDiv.innerText = res.message;
          setTimeout(() => { isProcessing = false; }, 2000);
        })
        .catch(err => {
          resultDiv.className = 'error';
          resultDiv.innerText = "【通信エラー】\nGASのデプロイ権限（全員）を確認してください";
          setTimeout(() => { isProcessing = false; }, 2500);
        });
    }
  </script>
</body>
</html>
