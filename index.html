<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文化祭 入場受付スキャナー</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: -apple-system, sans-serif; text-align: center; background-color: #f0f2f5; margin: 0; padding: 15px; }
    h2 { color: #333; margin-top: 5px; }
    #reader { width: 100%; max-width: 400px; margin: 10px auto; background: #000; border-radius: 12px; overflow: hidden; min-height: 250px; }
    #result { max-width: 400px; margin: 15px auto; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 10px; white-space: pre-wrap; line-height: 1.5; }
    .ok { background-color: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
    .error { background-color: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
    .loading { background-color: #fff3cd; color: #856404; border: 2px solid #ffeeba; }
    .start-btn { background-color: #007aff; color: white; border: none; padding: 16px 32px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

  <h2>文化祭 入場受付スキャナー</h2>
  
  <button id="start-btn" class="start-btn" onclick="initScanner()">📷 カメラを起動する</button>
  
  <div id="reader"></div>
  <div id="result" class="loading" style="display:none;"></div>

  <script>
    // ★Step 3でコピーしたGASのデプロイURL（末尾が /exec のもの）を貼り付けます
    const GAS_API_URL =https://script.google.com/macros/s/AKfycbzO_kSVfU9A9ty2ZCgilj819cmXXEtQ8qrlis7_7wxbmd_j2tgJNQ0ND48Jbqjq1jd6uQ/exec;

    let html5QrCode;
    let isProcessing = false;

    async function initScanner() {
      document.getElementById('start-btn').style.display = 'none';
      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'block';
      resultDiv.className = 'loading';
      resultDiv.innerText = "カメラを初期化中...";

      html5QrCode = new Html5Qrcode("reader");

      try {
        const devices = await Html5Qrcode.getCameras();
        let selectedCameraId;

        if (devices && devices.length > 0) {
          selectedCameraId = devices[devices.length - 1].id;
          for (let dev of devices) {
            const label = dev.label.toLowerCase();
            if (label.includes('back') || label.includes('背面') || label.includes('環境')) {
              selectedCameraId = dev.id;
              break;
            }
          }
          await html5QrCode.start(
            selectedCameraId,
            { fps: 15, qrbox: { width: 220, height: 220 } },
            onScanSuccess
          );
        } else {
          await startFallback();
        }
        resultDiv.innerText = "QRコードを枠内にかざしてください";
      } catch (err) {
        await startFallback();
      }
    }

    async function startFallback() {
      const resultDiv = document.getElementById('result');
      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 15, qrbox: { width: 220, height: 220 } },
          onScanSuccess
        );
        resultDiv.innerText = "QRコードを枠内にかざしてください";
      } catch (err) {
        resultDiv.className = 'error';
        resultDiv.innerText = "【カメラ起動エラー】\n" + err;
        document.getElementById('start-btn').style.display = 'inline-block';
      }
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      const resultDiv = document.getElementById('result');
      resultDiv.className = 'loading';
      resultDiv.innerText = "照合中...";

      const requestUrl = `${GAS_API_URL}?ticketId=${encodeURIComponent(decodedText)}`;

      fetch(requestUrl, { method: "GET", redirect: "follow" })
        .then(response => {
          if (!response.ok) throw new Error("ネットワーク応答エラー");
          return response.json();
        })
        .then(res => {
          resultDiv.className = res.success ? 'ok' : 'error';
          resultDiv.innerText = res.message;
          setTimeout(() => { isProcessing = false; }, 1800);
        })
        .catch(err => {
          resultDiv.className = 'error';
          resultDiv.innerText = "【通信エラー】\nGASのデプロイ権限（全員）を確認してください";
          setTimeout(() => { isProcessing = false; }, 2500);
        });
    }
  </script>
</body>
</html>
