<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カメラ動作テスト</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    video { width: 100%; max-width: 400px; height: 300px; background: #000; border-radius: 10px; margin-top: 10px; }
    button { padding: 15px 30px; font-size: 18px; font-weight: bold; background-color: #007aff; color: white; border: none; border-radius: 8px; }
    #status { font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>

  <h2>カメラ動作確認テスト</h2>
  <button onclick="testCamera()">📷 テストカメラ起動</button>
  
  <div id="status">ボタンを押してください</div>
  <video id="video" autoplay playsinline muted></video>

  <script>
    async function testCamera() {
      const status = document.getElementById('status');
      const video = document.getElementById('video');
      status.innerText = "カメラ起動リクエスト中...";

      try {
        // 背面カメラを優先取得
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } }
        });
        video.srcObject = stream;
        status.style.color = "green";
        status.innerText = "【成功】カメラの映像が表示されました！";
      } catch (err) {
        status.style.color = "red";
        status.innerText = "【失敗】" + err.name + ": " + err.message;
      }
    }
  </script>
</body>
</html>
